<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f3f3">
  <title>中国象棋 · 单机人机</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menu" class="screen">
    <div class="menu-card">
      <h1>中国象棋</h1>
      <div class="diff-row" id="menu-diff">
        <button type="button" class="diff" data-level="easy">入门</button>
        <button type="button" class="diff on" data-level="standard">标准</button>
        <button type="button" class="diff" data-level="hard">困难</button>
      </div>
      <p class="hint" id="menu-hint">标准：算得更深，中局能应对。</p>
      <button type="button" class="btn primary big" id="btn-start">出战</button>
    </div>
  </div>

  <div id="app" class="screen hidden">
    <header class="topbar">
      <button type="button" class="btn ghost" id="btn-home">菜单</button>
      <button type="button" class="btn ghost" id="btn-new">重开</button>
      <button type="button" class="btn ghost" id="btn-undo">悔棋 <span id="undo-left">5</span></button>
      <button type="button" class="btn ghost danger" id="btn-resign">认输</button>
    </header>
    <main class="stage">
      <div class="board-frame">
        <div class="board" id="board">
          <svg class="grid" id="grid" viewBox="-0.55 -0.55 9.1 10.1" preserveAspectRatio="xMidYMid meet"></svg>
          <div class="layer dots" id="dots"></div>
          <div class="layer pieces" id="pieces"></div>
        </div>
      </div>
    </main>
  </div>

  <div id="banner" class="banner hidden"></div>

  <script src="js/engine.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
