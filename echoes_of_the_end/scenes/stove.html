<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>灶台</title>
    <style>[v-cloak] { display: none; }</style>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/subpages.css">
</head>
<body class="scene-page" oncontextmenu="return false">
    <!-- 灶台子页：固定制作菜单（耗时烹饪，按背包+仓库物资直接制作）；Vue 数据加载完成前隐藏 -->
    <div id="stove" class="page-root" v-cloak style="display:none" v-show="loaded">
        <div class="page-header">
            <button class="page-back" @click="send({ type: 'close-page' })">‹ 返回</button>
        </div>
        <div class="page-body">
            <!-- 烹饪锅燃料：做饭需燃料（木板），1 木板 = 60 分钟 = 6 次饭 -->
            <div class="stove-fuel">
                <div class="fire-add-title">燃料：{{ fuelMinutes }} 分钟（1 木板 = 60 分钟，可做 6 次饭）</div>
                <div class="fire-add-btns">
                    <button v-for="n in addAmounts" :key="n" class="fire-add-btn"
                            :disabled="woodCount < n"
                            @click="send({ type: 'add-stove-fuel', count: n })">
                        {{ '加 ' + n + ' 木板' }}
                    </button>
                </div>
            </div>

            <!-- 制作按钮：固定菜单，按背包+仓库物资直接制作 -->
            <div class="stove-ops">
                <div v-for="a in GameData.stoveMenu" :key="a.name" class="stove-item-row">
                    <div class="stove-item-main">
                        <span class="stove-item-name" v-text="a.name"></span>
                        <span class="stove-item-cost">
                            <span v-for="(amt, mat) in a.inputs" :key="mat"
                                  :class="have(mat) >= amt ? 'enough' : 'lacking'" v-text="mat + '×' + amt"></span>
                        </span>
                    </div>
                    <button class="bed-upgrade-btn stove-cook-btn"
                            :disabled="!canCook(a)"
                            @click="send({ type: 'stove-cook', name: a.name })">
                        <span>制作</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/vue.min.js"></script>
    <script>
    // 灶台子页：Vue 渲染固定制作菜单，操作转发给外壳处理
    var app = new Vue({
        el: '#stove',
        data: {
            loaded: false,
            stove: null,
            bag: [],
            storageItems: [],
            fuelUntil: 0,
            gameSeconds: 0,
            addAmounts: [1, 2, 4]
        },
        computed: {
            // 背包 + 仓库全部可制作原料
            allItems() {
                return (this.bag || []).concat(this.storageItems || []);
            },
            // 烹饪锅剩余燃料（分钟）
            fuelMinutes() {
                return Math.max(0, Math.floor((this.fuelUntil - this.gameSeconds) / 60));
            },
            // 背包+仓库木板数量
            woodCount() {
                return this.allItems
                    .filter(it => it.name === '木板')
                    .reduce((s, it) => s + (it.count || 1), 0);
            }
        },
        methods: {
            send(msg) {
                window.parent.postMessage(msg, '*');
            },
            // 当前背包+仓库中某物品的总数量
            have(name) {
                return this.allItems
                    .filter(it => it.name === name)
                    .reduce((s, it) => s + (it.count || 1), 0);
            },
            // 当前菜单项是否可制作：有燃料（≥10 分钟）且原料充足（烹饪锅单级）
            canCook(a) {
                if (!this.stove) return false;
                if (this.fuelUntil - this.gameSeconds < 600) return false;
                for (var mat in a.inputs) {
                    if (this.have(mat) < a.inputs[mat]) return false;
                }
                return true;
            }
        }
    });

    window.addEventListener('message', function (e) {
        var msg = e.data;
        if (msg && msg.type === 'init') {
            app.stove = msg.state.currentStove;
            app.bag = msg.state.bag;
            app.storageItems = msg.state.storageItems || [];
            app.fuelUntil = msg.state.stoveFuelUntil || 0;
            app.gameSeconds = msg.state.gameSeconds || 0;
            app.loaded = true;
        } else if (msg && msg.type === 'scroll-reset') {
            app.$nextTick(resetScroll);
        }
    });

    function resetScroll() {
        var sc = document.querySelectorAll('*');
        for (var i = 0; i < sc.length; i++) {
            if (sc[i].scrollHeight > sc[i].clientHeight) sc[i].scrollTop = 0;
        }
    }
    </script>
</body>
</html>
