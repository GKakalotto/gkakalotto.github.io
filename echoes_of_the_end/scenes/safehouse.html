<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>安全屋</title>
    <style>[v-cloak] { display: none; }</style>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/scenes.css">
</head>
<body class="scene-page" oncontextmenu="return false">
    <!-- 安全屋场景：数据来自外壳 postMessage，Vue 加载完成前隐藏 -->
    <div id="safehouse" class="safehouse-scene" v-cloak style="display:none" v-show="loaded">
        <!-- 室内：安全屋设施 -->
        <div class="interior-area">
            <div class="furniture-grid">
                <div class="furniture-slot" v-for="(f, i) in furniture" :key="i"
                     v-if="!f.isStorage"
                     :class="{ unlocked: f.unlocked }" @click="onSlot(i)">
                    <div class="slot-icon" v-text="slotIcon(f)"></div>
                    <span v-text="slotName(f)"></span>
                    <div v-if="!f.unlocked" class="lock-overlay">🔒</div>
                </div>
            </div>
        </div>

        <!-- 大门 -->
        <div class="room-divider">
            <div class="divider-line"></div>
            <button class="divider-door" @click="send({ type: 'open-door' })" title="外出探索">
                <span class="divider-door-icon">🚪</span>
                <span>大门</span>
            </button>
        </div>

        <!-- 室外：狗窝、防御栅栏 -->
        <div class="outdoor-area">
            <div class="outdoor-item" v-for="(o, j) in outdoors" :key="j"
                 :class="{ locked: !o.unlocked }" @click="send({ type: 'outdoor-click', index: j })">
                <div class="outdoor-icon" v-text="o.icon"></div>
                <div class="outdoor-info">
                    <div class="outdoor-name" v-text="o.name"></div>
                    <div class="outdoor-desc" v-text="o.desc"></div>
                </div>
                <div v-if="!o.unlocked" class="lock-overlay">🔒</div>
            </div>
        </div>
    </div>

    <script src="../js/vue.min.js"></script>
    <script>
    // 安全屋场景页：Vue 渲染家具/大门/室外设施，点击消息转发给外壳
    var app = new Vue({
        el: '#safehouse',
        data: {
            loaded: false,
            furniture: [],
            outdoors: []
        },
        methods: {
            send(msg) {
                window.parent.postMessage(msg, '*');
            },
            // 床/仓库/篝火显示当前等级名，其余显示名字
            slotName(f) {
                if (f.isBed) return f.bedLevels[f.bedLevel].name;
                if (f.isStorage) return f.storageLevels[f.storageLevel].name;
                if (f.isFireplace) return f.fireLevels[f.fireLevel].name;
                if (f.isStove) return f.stoveLevels[f.stoveLevel].name;
                if (f.isRainCollector) return f.rainLevels[f.rainLevel].name;
                return f.name;
            },
            slotIcon(f) {
                return f.isBed ? '🛏️' : f.icon;
            },
            // 家具点击：统一发送索引，由外壳按 isBed / isWorkbench / isStorage 分发
            onSlot(i) {
                this.send({ type: 'open-furniture', index: i });
            }
        }
    });

    window.addEventListener('message', function (e) {
        var msg = e.data;
        if (msg && msg.type === 'init') {
            app.furniture = msg.state.furniture;
            app.outdoors = msg.state.outdoors;
            app.loaded = true;
        }
    });
    </script>
</body>
</html>
