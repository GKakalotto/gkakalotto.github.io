<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家具</title>
    <style>[v-cloak] { display: none; }</style>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/subpages.css">
</head>
<body class="scene-page" oncontextmenu="return false">
    <!-- 家具详情子页：未解锁家具显示解锁入口；Vue 数据加载完成前隐藏 -->
    <div id="furniture" class="page-root" v-cloak style="display:none" v-show="loaded">
        <div class="page-header">
            <button class="page-back" @click="send({ type: 'close-page' })">‹ 返回</button>
        </div>
        <div class="page-body">
            <!-- 未解锁家具：显示解锁材料成本，材料不足时解锁按钮禁用 -->
            <div v-if="f && !f.unlocked" class="bed-section bed-upgrade upgrade-card">
                <div class="bed-upgrade-row">
                    <div class="bed-upgrade-info">
                        <div class="bed-next">解锁需要</div>
                        <div class="bed-cost">
                            <span class="bed-cost-item" v-for="(amt, mat) in f.unlockCost" :key="mat"
                                  :class="have(mat) >= amt ? 'enough' : 'lacking'"
                                  v-text="mat + ' ×' + amt"></span>
                        </div>
                    </div>
                    <button class="bed-upgrade-btn" :disabled="!canUnlock" @click="onUnlock">解锁</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/vue.min.js"></script>
    <script>
    // 家具详情子页：Vue 渲染解锁按钮，解锁消息转发给外壳
    var app = new Vue({
        el: '#furniture',
        data: {
            loaded: false,
            f: null,
            bag: [],
            storageItems: []
        },
        computed: {
            // 材料是否足够解锁当前家具（背包 + 仓库）
            canUnlock() {
                if (!this.f) return false;
                for (const mat in this.f.unlockCost || {}) {
                    if (this.have(mat) < this.f.unlockCost[mat]) return false;
                }
                return true;
            }
        },
        methods: {
            send(msg) {
                window.parent.postMessage(msg, '*');
            },
            // 背包 + 仓库中某材料总数量
            have(name) {
                return (this.bag || []).concat(this.storageItems || [])
                    .filter(it => it.name === name)
                    .reduce((s, it) => s + (it.count || 1), 0);
            },
            // 解锁当前家具：消息转发给外壳，由外壳扣材料并置 unlocked 后保存刷新
            onUnlock() {
                this.send({ type: 'unlock-furniture' });
            }
        }
    });

    window.addEventListener('message', function (e) {
        var msg = e.data;
        if (msg && msg.type === 'init') {
            app.f = msg.state.currentFurniture;
            app.bag = msg.state.bag || [];
            app.storageItems = msg.state.storageItems || [];
            app.loaded = true;
        }
    });

    window.addEventListener("message", function (e) {
        if (e.data && e.data.type === "scroll-reset") {
            app.$nextTick(function () {
                var s = document.querySelectorAll("*");
                for (var i = 0; i < s.length; i++) {
                    if (s[i].scrollHeight > s[i].clientHeight) s[i].scrollTop = 0;
                }
            });
        }
    });
    </script>
</body>
</html>
