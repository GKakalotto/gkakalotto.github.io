<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>工作台</title>
    <style>[v-cloak] { display: none; }</style>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/subpages.css">
</head>
<body class="scene-page" oncontextmenu="return false">
    <!-- 工作台子页：一级分类菜单 → 二级蓝图列表，制作操作转发给外壳；Vue 数据加载完成前隐藏 -->
    <div id="wb" class="page-root" v-cloak style="display:none" v-show="loaded">
        <div class="page-header">
            <button class="page-close" @click="send({ type: 'close-page' })">✕</button>
        </div>
        <div class="page-body">
            <!-- 一级：分类菜单 -->
            <div v-if="view === 'menu'" class="wb-menu">
                <div class="wb-cat" v-for="(list, cat) in blueprints" :key="cat" @click="openCat(cat)">
                    <span class="wb-cat-icon" v-text="UI.catIcon(cat)"></span>
                    <span class="wb-cat-name" v-text="UI.catName(cat)"></span>
                    <span class="wb-cat-count" v-text="list.length + ' 项'"></span>
                </div>
            </div>
            <!-- 二级：所选分类的蓝图列表 -->
            <div v-else class="wb-list">
                <div class="wb-back" @click="view = 'menu'">‹ 返回</div>
                <div class="wb-bp" v-for="(bp, i) in blueprints[cat]" :key="i">
                    <div class="wb-bp-head">
                        <span class="wb-bp-name" v-text="bp.name"></span>
                    </div>
                    <div class="wb-bp-cost">
                        <span class="bed-cost-item" v-for="(amt, mat) in bp.cost" :key="mat"
                              :class="UI.materialCount(bag, mat) >= amt ? 'enough' : 'lacking'" v-text="mat + ' ×' + amt"></span>
                    </div>
                    <button class="wb-craft-btn" :disabled="!canCraft(bp.cost)" @click="craft(cat, i)">制作</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/vue.min.js"></script>
    <script>
    // 工作台子页：Vue 渲染分类菜单与蓝图，制作/返回操作转发给外壳
    var app = new Vue({
        el: '#wb',
        data: {
            loaded: false,
            wb: null,
            bag: [],
            view: 'menu',   // 'menu' 一级分类 / 'list' 二级蓝图
            cat: null       // 当前选中的分类
        },
        computed: {
            blueprints() {
                return this.wb ? this.wb.blueprints : {};
            }
        },
        methods: {
            send(msg) {
                window.parent.postMessage(msg, '*');
            },
            // 某蓝图是否满足全部材料
            canCraft(cost) {
                return UI.hasMaterials(this.bag, cost);
            },
            // 进入某分类的二级蓝图列表
            openCat(cat) {
                this.cat = cat;
                this.view = 'list';
            },
            // 制作：把分类 + 索引交给外壳处理（材料校验与扣减在外壳）
            craft(cat, index) {
                this.send({ type: 'craft', cat: cat, index: index });
            }
        }
    });

    window.addEventListener('message', function (e) {
        var msg = e.data;
        if (msg && msg.type === 'init') {
            app.wb = msg.state.currentWorkbench;
            app.bag = msg.state.bag;
            app.loaded = true;
        }
    });
    </script>
</body>
</html>
