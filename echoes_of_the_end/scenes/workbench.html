<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>工作台</title>
    <style>[v-cloak] { display: none; }</style>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/subpages.css">
</head>
<body class="scene-page" oncontextmenu="return false">
    <!-- 工作台子页：一级分类菜单 → 二级蓝图列表，制作操作转发给外壳；Vue 数据加载完成前隐藏 -->
    <div id="wb" class="page-root" v-cloak style="display:none" v-show="loaded">
        <div class="page-header">
            <button class="page-back" @click="view === 'list' ? (view = 'menu') : send({ type: 'close-page' })">‹ 返回</button>
        </div>
        <div class="page-body">
            <!-- 一级：分类菜单 -->
            <div v-if="view === 'menu'" class="wb-menu">
                <div class="wb-cat" v-for="cat in cats" :key="cat" @click="openCat(cat)">
                    <span class="wb-cat-icon" v-text="UI.catIcon(cat)"></span>
                    <span class="wb-cat-name" v-text="UI.catName(cat)"></span>
                    <span class="wb-cat-count" v-text="catCount(cat)"></span>
                </div>
            </div>
            <!-- 二级：蓝图列表或升级列表 -->
            <div v-else-if="cat !== 'upgrade'" class="wb-list">
                <div class="wb-bp" v-for="(bp, i) in blueprints[cat]" :key="i">
                    <div class="wb-bp-head">
                        <span class="wb-bp-name" v-text="bp.name + (bp.count > 1 ? ' ×' + bp.count : '')"></span>
                    </div>
                    <div class="wb-bp-cost">
                        <span class="bed-cost-item" v-for="(amt, mat) in bp.cost" :key="mat"
                              :class="have(mat) >= amt ? 'enough' : 'lacking'" v-text="mat + ' ×' + amt"></span>
                    </div>
                    <button class="wb-craft-btn" :disabled="!canCraft(bp.cost)" @click="craft(cat, i)">制作</button>
                </div>
            </div>
            <!-- 二级：升级列表（原分散在各家具/背包页的升级统一收拢到这里） -->
            <div v-else class="wb-list">
                <div class="wb-bp" v-for="u in upgradeList" :key="u.type">
                    <div class="wb-bp-head">
                        <span class="wb-bp-name" v-text="u.name"></span>
                    </div>
                    <div v-if="!u.maxed" class="wb-bp-cost">
                        <span class="bed-cost-item" v-for="(amt, mat) in u.cost" :key="mat"
                              :class="have(mat) >= amt ? 'enough' : 'lacking'" v-text="mat + ' ×' + amt"></span>
                    </div>
                    <button v-if="!u.maxed" class="wb-craft-btn" :disabled="!canCraft(u.cost)" @click="upgrade(u.type)">升级</button>
                    <span v-else class="upgrade-max">已达最高等级</span>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/vue.min.js"></script>
    <script>
    // 工作台子页：Vue 渲染分类菜单与蓝图，制作/返回操作转发给外壳
    var app = new Vue({
        el: '#wb',
        data: {
            loaded: false,
            wb: null,
            bag: [],
            storageItems: [],
            furniture: [],
            bagLevel: 0,
            bagMax: 0,
            view: 'menu',   // 'menu' 一级分类 / 'list' 二级蓝图或升级
            cat: null       // 当前选中的分类
        },
        computed: {
            // 六类蓝图（来自工作台数据）
            blueprints() {
                return this.wb ? this.wb.blueprints : {};
            },
            // 一级菜单分类：六类蓝图 + 升级
            cats() {
                return Object.keys(this.blueprints).concat(['upgrade']);
            },
            // 升级列表：床/篝火/灶台/雨水/仓库/种植园 + 背包
            upgradeList() {
                const f = this.furniture || [];
                const find = (flag) => f.find(x => x[flag]);
                const items = [
                    { flag: 'isBed', type: 'bed', name: '床', levelKey: 'bedLevel', levelsKey: 'bedLevels' },
                    { flag: 'isFireplace', type: 'fire', name: '篝火', levelKey: 'fireLevel', levelsKey: 'fireLevels' },
                    { flag: 'isStove', type: 'stove', name: '灶台', levelKey: 'stoveLevel', levelsKey: 'stoveLevels' },
                    { flag: 'isRainCollector', type: 'rain', name: '雨水收集器', levelKey: 'rainLevel', levelsKey: 'rainLevels' },
                    { flag: 'isStorage', type: 'storage', name: '仓库', levelKey: 'storageLevel', levelsKey: 'storageLevels' },
                    { flag: 'isPlantation', type: 'plantation', name: '种植园', levelKey: 'plantationLevel', levelsKey: 'plantationLevels' }
                ];
                const list = items.map(it => {
                    const x = find(it.flag);
                    if (!x) return null;
                    const level = x[it.levelKey] || 0;
                    const levels = x[it.levelsKey] || [];
                    const maxed = level >= levels.length - 1;
                    const cost = maxed ? {} : (levels[level].upgrade || {});
                    return { type: 'upgrade-' + it.type, name: it.name, level: level, maxed: maxed, cost: cost };
                }).filter(Boolean);
                // 背包升级
                const bagMaxed = this.bagLevel >= this.bagUpgradeMax();
                list.push({
                    type: 'upgrade-bag',
                    name: '背包',
                    level: this.bagLevel,
                    maxed: bagMaxed,
                    cost: bagMaxed ? {} : this.bagUpgradeCost()
                });
                return list;
            }
        },
        methods: {
            send(msg) {
                window.parent.postMessage(msg, '*');
            },
            // 背包 + 仓库中某材料总数量
            have(name) {
                return (this.bag || []).concat(this.storageItems || [])
                    .filter(it => it.name === name)
                    .reduce((s, it) => s + (it.count || 1), 0);
            },
            // 某蓝图是否满足全部材料
            canCraft(cost) {
                for (const mat in cost) {
                    if (this.have(mat) < cost[mat]) return false;
                }
                return true;
            },
            // 一级菜单各类别的条目数
            catCount(cat) {
                if (cat === 'upgrade') return this.upgradeList.length + ' 项';
                const list = this.blueprints[cat];
                return (list ? list.length : 0) + ' 项';
            },
            // 进入某分类的二级列表
            openCat(cat) {
                this.cat = cat;
                this.view = 'list';
            },
            // 制作：把分类 + 索引交给外壳处理（材料校验与扣减在外壳）
            craft(cat, index) {
                this.send({ type: 'craft', cat: cat, index: index });
            },
            // 背包升级最大等级（与外壳 GameData.bagLevels 一致）
            bagUpgradeMax() {
                const levels = (window.GameData && window.GameData.bagLevels) || [];
                return levels.length - 1;
            },
            // 背包升级成本：复用外壳 GameData 中 bagLevels 配置（当前等级的 upgrade）
            bagUpgradeCost() {
                const levels = (window.GameData && window.GameData.bagLevels) || [];
                const cur = levels[this.bagLevel];
                return cur ? (cur.upgrade || {}) : {};
            },
            // 升级：把升级类型交给外壳处理（弹窗/扣料在外壳）
            upgrade(type) {
                this.send({ type: type });
            }
        }
    });

    window.addEventListener('message', function (e) {
        var msg = e.data;
        if (msg && msg.type === 'init') {
            app.wb = msg.state.currentWorkbench;
            app.bag = msg.state.bag;
            app.storageItems = msg.state.storageItems || [];
            app.furniture = msg.state.furniture || [];
            app.bagLevel = msg.state.bagLevel || 0;
            app.bagMax = msg.state.bagMax || 0;
            app.loaded = true;
        }
    });
    </script>
</body>
</html>
