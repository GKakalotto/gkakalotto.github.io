<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>仓库</title>
    <style>[v-cloak] { display: none; }</style>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/subpages.css">
</head>
<body class="scene-page" oncontextmenu="return false">
    <!-- 仓库子页：仓库物品卡片，点击物品弹出操作菜单；Vue 数据加载完成前隐藏 -->
    <div id="storage" class="page-root" v-cloak style="display:none" v-show="loaded">
        <div class="page-header">
            <button class="page-back" @click="send({ type: 'close-page' })">‹ 返回</button>
            <button v-if="storage && storage.storageLevel < storage.storageLevels.length - 1" class="upgrade-btn" @click="send({ type: 'upgrade-storage' })">升级</button>
            <span v-else class="upgrade-max">已达最高等级</span>
            <button class="sort-btn" @click="send({ type: 'sort-storage' })">整理</button>
        </div>
        <div class="page-body st-body">
            <!-- 物品区：按仓库容量渲染全部槽位格子，空槽也显示 -->
            <div class="st-items">
                <div class="st-item" v-for="i in cap" :key="i" :class="{ empty: !storageItems[i - 1] }"
                     @click="storageItems[i - 1] && openMenu(i - 1)">
                    <template v-if="storageItems[i - 1]">
                        <span class="st-item-name" v-text="storageItems[i - 1].name"></span>
                        <span class="st-item-meta" v-if="storageItems[i - 1].count" v-text="'×' + storageItems[i - 1].count"></span>
                    </template>
                </div>
            </div>
        </div>

        <!-- 物品操作菜单 -->
        <div v-if="menu.show" class="item-menu-overlay" @click.self="closeMenu">
            <div class="item-menu">
                <template v-if="menu.confirmDiscard">
                    <div class="item-menu-title">确定丢弃「{{ menuItem ? menuItem.name : '' }}」？</div>
                    <button class="item-menu-btn danger" @click="act('storage-discard')">确定丢弃</button>
                    <button class="item-menu-btn" @click="menu.confirmDiscard = false">返回</button>
                </template>
                <template v-else>
                    <div class="item-menu-title" v-text="menuItem ? menuItem.name : ''"></div>
                    <div class="item-menu-meta" v-if="menuItem">
                        <div v-if="menuItem.damage" v-text="'攻击 ' + menuItem.damage"></div>
                        <div v-else-if="menuItem.defense" v-text="'减伤 ' + menuItem.defense"></div>
                        <div v-if="menuItem.durability" v-text="'耐久 ' + menuItem.durability"></div>
                        <div v-if="menuItem.restore" v-text="'恢复' + menuItem.restore.statName + ' +' + menuItem.restore.amount"></div>
                    </div>
                    <button class="item-menu-btn" @click="act('storage-move-bag')">🎒 放入背包</button>
                    <button v-if="useCfg" class="item-menu-btn" @click="act('storage-use')" v-text="useCfg.label"></button>
                    <button class="item-menu-btn danger" @click="menu.confirmDiscard = true">🗑️ 丢弃</button>
                    <button class="item-menu-btn" @click="closeMenu">取消</button>
                </template>
            </div>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/vue.min.js"></script>
    <script>
    // 仓库子页：Vue 渲染仓库物品卡片，物品操作/升级转发给外壳处理
    var app = new Vue({
        el: '#storage',
        data: {
            loaded: false,
            storage: null,
            bag: [],
            storageItems: [],
            menu: { show: false, index: -1, confirmDiscard: false }
        },
        computed: {
            menuItem() {
                return this.menu.show ? this.storageItems[this.menu.index] : null;
            },
            // 仓库当前容量（槽位数）
            cap() {
                return this.storage ? this.storage.storageLevels[this.storage.storageLevel].capacity : 0;
            },
            useCfg() {
                var it = this.menuItem;
                if (!it) return null;
                var cfg = it.restore || GameData.itemUse[it.type] || null;
                if (cfg && !cfg.label) cfg = Object.assign({}, cfg, { label: (it.type === 'water' || it.type === 'drink') ? '喝' : '吃' });
                return cfg;
            }
        },
        methods: {
            send(msg) {
                window.parent.postMessage(msg, '*');
            },
            openMenu(i) {
                this.menu = { show: true, index: i, confirmDiscard: false };
            },
            closeMenu() {
                this.menu.show = false;
            },
            act(type) {
                this.send({ type: type, index: this.menu.index });
                this.menu.show = false;
            }
        }
    });

    window.addEventListener('message', function (e) {
        var msg = e.data;
        if (msg && msg.type === 'init') {
            app.storage = msg.state.currentStorage;
            app.bag = msg.state.bag;
            app.storageItems = msg.state.storageItems;
            app.loaded = true;
        }
    });
    </script>
</body>
</html>
