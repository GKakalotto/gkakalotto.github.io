<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>篝火</title>
    <style>[v-cloak] { display: none; }</style>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/subpages.css">
</head>
<body class="scene-page" oncontextmenu="return false">
    <!-- 篝火子页：燃烧状态 + 燃料倒计时 + 添加木板；倒计时由外壳每秒推送状态刷新 -->
    <div id="fire" class="page-root" v-cloak style="display:none" v-show="loaded">
        <div class="page-header">
            <button class="page-back" @click="send({ type: 'close-page' })">‹ 返回</button>
        </div>
        <div class="page-body fire-body">
            <!-- 燃烧状态（窄）与锅槽（右侧）并排 -->
            <div class="fire-top">
                <div class="upgrade-card fire-info">
                    <div class="fire-status" :class="{ lit: burning }" v-text="burning ? '🔥 燃烧中' : '⛔ 已熄灭'"></div>
                    <div class="fire-timer" v-text="timerText"></div>
                    <div class="fire-desc" v-text="burning ? '篝火燃烧中，房间温暖。' : '添加木板点燃篝火。'"></div>
                </div>
                <!-- 锅槽：放锅后可以烧水；点击放入/取下锅 -->
                <div class="fire-pot">
                    <div class="fire-add-title">锅槽</div>
                    <button class="fire-pot-slot" :class="{ has: hasPot }" @click="send({ type: 'fire-pot' })"
                            :title="hasPot ? '取下锅' : '放一口锅'"
                            v-text="hasPot ? '🍳' : ''"></button>
                </div>
            </div>

            <!-- 添加燃料 -->
            <div class="fire-add">
                <div class="fire-add-title">添加木板（库存：{{ woodCount }} 块）</div>
                <div class="fire-add-btns">
                    <button v-for="n in addAmounts" :key="n" class="fire-add-btn"
                            :disabled="woodCount < n"
                            @click="send({ type: 'add-fuel', count: n })">
                        {{ '添加 ' + n + ' 块' }}
                    </button>
                </div>
            </div>

            <!-- 篝火烹饪菜单（烤肉/烤鱼/烧水等；烧水需放锅）：标题固定，仅菜单项滚动 -->
            <div class="fire-menu">
                <div class="fire-add-title">烹饪</div>
                <div class="fire-menu-list">
                    <div v-for="a in GameData.fireMenu" :key="a.name" class="stove-item-row">
                        <div class="stove-item-main">
                            <span class="stove-item-name" v-text="a.name"></span>
                            <span class="stove-item-cost">
                                <span v-for="(amt, mat) in a.inputs" :key="mat"
                                      :class="have(mat) >= amt ? 'enough' : 'lacking'" v-text="mat + '×' + amt"></span>
                            </span>
                        </div>
                        <button class="bed-upgrade-btn stove-cook-btn"
                                :disabled="!canFireCook(a)"
                                @click="send({ type: 'fire-cook', name: a.name })">
                            <span v-text="a.needsPot && !hasPot ? '需放锅' : '制作'"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/vue.min.js"></script>
    <script>
    // 篝火子页：Vue 渲染燃烧状态与倒计时，添加燃料/升级操作转发给外壳处理
    var app = new Vue({
        el: '#fire',
        data: {
            loaded: false,
            fire: null,
            bag: [],
            storageItems: [],
            fuelUntil: 0,
            gameSeconds: 0,
            addAmounts: [1, 2, 4, 8]
        },
        computed: {
            // 篝火是否已放锅
            hasPot() {
                return !!(this.fire && this.fire.hasPot);
            },
            burning() {
                return !!this.fire && this.gameSeconds < this.fuelUntil;
            },
            hoursPerWood() {
                return this.fire ? this.fire.fireLevels[this.fire.fireLevel].hoursPerWood : 1;
            },
            // 木板数量（背包 + 仓库）
            woodCount() {
                return (this.bag || []).concat(this.storageItems || [])
                    .filter(it => it.name === '木板')
                    .reduce((s, it) => s + (it.count || 1), 0);
            },
            // 剩余燃料倒计时（X 小时 Y 分）
            timerText() {
                if (!this.burning) return '剩余 0 分钟';
                var sec = this.fuelUntil - this.gameSeconds;
                var h = Math.floor(sec / 3600);
                var m = Math.floor((sec % 3600) / 60);
                return '剩余 ' + (h > 0 ? h + ' 小时 ' : '') + m + ' 分钟';
            },
            // 背包 + 仓库全部物品
            allItems() {
                return (this.bag || []).concat(this.storageItems || []);
            }
        },
        methods: {
            send(msg) {
                window.parent.postMessage(msg, '*');
            },
            // 当前背包+仓库中某物品总数量
            have(name) {
                return this.allItems
                    .filter(it => it.name === name)
                    .reduce((s, it) => s + (it.count || 1), 0);
            },
            // 篝火菜单项是否可做：需燃料（≥10 分钟）、烧水需放锅，且原料充足
            canFireCook(a) {
                if (this.gameSeconds >= this.fuelUntil) return false;
                if (this.fuelUntil - this.gameSeconds < 600) return false;
                if (a.needsPot && !this.hasPot) return false;
                for (var mat in a.inputs) {
                    if (this.have(mat) < a.inputs[mat]) return false;
                }
                return true;
            }
        }
    });

    window.addEventListener('message', function (e) {
        var msg = e.data;
        if (msg && msg.type === 'init') {
            app.fire = msg.state.currentFire;
            app.bag = msg.state.bag;
            app.storageItems = msg.state.storageItems || [];
            app.fuelUntil = msg.state.fireFuelUntil;
            app.gameSeconds = msg.state.gameSeconds;
            app.loaded = true;
        } else if (msg && msg.type === 'scroll-reset') {
            app.$nextTick(resetScroll);
        }
    });
    function resetScroll() {
        var sc = document.querySelectorAll('*');
        for (var i = 0; i < sc.length; i++) {
            if (sc[i].scrollHeight > sc[i].clientHeight) sc[i].scrollTop = 0;
        }
    }
    </script>
</body>
</html>
