<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>椅子</title>
    <style>[v-cloak] { display: none; }</style>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/subpages.css">
</head>
<body class="scene-page" oncontextmenu="return false">
    <!-- 椅子子页：休息；Vue 数据加载完成前隐藏 -->
    <div id="chair" class="page-root" v-cloak style="display:none" v-show="loaded">
        <div class="page-header">
            <button class="page-back" @click="send({ type: 'close-page' })">‹ 返回</button>
            <button v-if="chair && chair.chairLevel < chair.chairLevels.length - 1" class="upgrade-btn" @click="send({ type: 'upgrade-chair' })">升级</button>
            <span v-else class="upgrade-max">已达最高等级</span>
        </div>
        <div class="page-body">
            <!-- 休息 -->
            <div class="bed-section upgrade-card chair-rest-card" v-if="chair">
                <div class="chair-rest-info">休息一次恢复体力 <span v-text="chair.chairLevels[chair.chairLevel].restore"></span>（上限 100）</div>
                <button class="bed-upgrade-btn chair-rest-btn" @click="send({ type: 'chair-rest' })">休息</button>
            </div>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/vue.min.js"></script>
    <script>
    // 椅子子页：Vue 渲染休息，升级/休息操作转发给外壳处理
    var app = new Vue({
        el: '#chair',
        data: {
            loaded: false,
            chair: null,
            bag: []
        },
        methods: {
            send(msg) {
                window.parent.postMessage(msg, '*');
            }
        }
    });

    window.addEventListener('message', function (e) {
        var msg = e.data;
        if (msg && msg.type === 'init') {
            app.chair = msg.state.currentChair;
            app.bag = msg.state.bag;
            app.loaded = true;
        }
    });
    </script>
</body>
</html>
