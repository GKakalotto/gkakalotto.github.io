<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>背包</title>
    <style>[v-cloak] { display: none; }</style>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/subpages.css">
</head>
<body class="scene-page" oncontextmenu="return false">
    <!-- 背包子页：物品卡片（名字+右下角数量），点击弹详情（数量/堆叠/操作），底部装备栏；容量显示在外壳顶栏正中 -->
    <div id="bag" class="page-root" v-cloak style="display:none" v-show="loaded">
        <div class="page-header">
            <button class="page-back" @click="send({ type: 'close-page' })">‹ 返回</button>
        </div>
        <div class="page-body bag-body bag-three">
            <!-- 上：装备栏（武器 / 工具 / 帽子 / 防具） -->
            <div class="bag-top">
                <div class="bag-sec-title">装备</div>
                <div class="bag-footer">
                    <div class="equip-slot" v-for="s in equipSlots" :key="s.key" @click="onEquipSlot(s.key)">
                        <div class="equip-slot-label" v-text="s.label"></div>
                        <div class="equip-slot-item" :class="{ empty: !equipment[s.key] }"
                             v-text="equipment[s.key] ? equipment[s.key].name : '空'"></div>
                    </div>
                </div>
            </div>
            <!-- 中：背包物品（点击转移到仓库/暂存点） -->
            <div class="bag-mid">
                <div class="bag-sec-title">背包</div>
                <div class="st-items">
                    <div class="st-item" v-for="i in bagMax" :key="i" :class="{ empty: !bag[i - 1] }"
                         :class="{ clickable: bag[i - 1] && canMoveOut }"
                         @click="bag[i - 1] && onBagItem(i - 1)">
                        <template v-if="bag[i - 1]">
                            <span class="st-item-name" v-text="bag[i - 1].name"></span>
                            <span class="st-item-meta" v-if="!bag[i - 1].durability" v-text="'×' + (bag[i - 1].count || 1)"></span>
                        </template>
                    </div>
                </div>
            </div>
            <!-- 下：战利品（搜刮所得，可操作）/ 仓库 / 暂存点（点击转移到背包） -->
            <div class="bag-bottom" v-if="storageView">
                <div class="bag-sec-title" v-text="storageView.title"></div>
                <div class="st-items">
                    <div class="st-item" v-for="(it, i) in storageView.items" :key="i"
                         class="clickable" @click="storageView.isLoot ? lootTake(i) : onStorageItem(i)">
                        <span class="st-item-name" v-text="it.name"></span>
                        <span class="st-item-meta" v-if="!it.durability" v-text="'×' + (it.count || 1)"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 装备选择菜单：点击装备槽弹出，显示背包中该槽可选物品，点击装备；可卸下当前 -->
        <div v-if="equipMenu.show" class="item-menu-overlay" @click.self="closeEquipMenu">
            <div class="item-menu">
                <div class="item-menu-title">
                    <span v-text="equipMenu.slotLabel + '装备'"></span>
                    <button class="item-menu-close" @click="closeEquipMenu">×</button>
                </div>
                <div class="equip-list">
                    <div class="equip-item" v-for="e in equipMenu.items" :key="(e.equipped ? 'eq' : 'bag') + (e.index !== null ? e.index : '')"
                         :class="{ equipped: e.equipped }" @click="onEquipItem(e)">
                        <span class="equip-item-name" v-text="e.item.name"></span>
                        <span class="equip-item-stat">
                            <span v-if="e.item.damage" v-text="'攻 ' + e.item.damage"></span>
                            <span v-if="e.item.damageReduction" v-text="'减伤 ' + e.item.damageReduction + '%'"></span>
                            <span v-if="e.item.durability" v-text="'耐 ' + e.item.durability"></span>
                        </span>
                    </div>
                </div>
                <p v-if="equipMenu.items.length === 0" class="bag-empty">背包中没有可装备的{{ equipMenu.slotLabel }}。</p>
            </div>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/vue.min.js"></script>
    <script>
    // 背包子页：Vue 渲染物品卡片与装备栏，点击弹详情菜单，操作消息转发给外壳执行
    var app = new Vue({
        el: '#bag',
        data: {
            loaded: false,
            currentScene: 'safehouse',
            currentPlace: null,
            bag: [],
            storageItems: [],
            placeStash: {},
            pendingLoot: null,
            bagMax: 30,
            bagLevel: 0,
            equipment: { weapon: null, tool: null, hat: null, armor: null },
            equipSlots: [
                { key: 'weapon', label: '武器' },
                { key: 'tool',   label: '工具' },
                { key: 'hat',    label: '帽子' },
                { key: 'armor',  label: '防具' }
            ],
            equipMenu: { show: false, slot: null, items: [] }
        },
        computed: {
            // 下部展示：搜刮后（有 pendingLoot）恒为战利品区（即使取完）；否则家→仓库、地点→暂存点、地图→不显示
            storageView() {
                if (this.pendingLoot) {
                    return { title: '战利品', items: this.pendingLoot.items || [], isLoot: true };
                }
                if (this.currentScene === 'safehouse') {
                    return { title: '仓库', items: this.storageItems || [] };
                }
                if (this.currentScene === 'place') {
                    var key = this.currentPlace && this.currentPlace.key;
                    return { title: '暂存点', items: (key && this.placeStash[key]) || [] };
                }
                return null;
            },
            // 背包物品能否转移（家→仓库，地点→暂存点；地图不可）
            canMoveOut() {
                return this.currentScene === 'safehouse' || this.currentScene === 'place';
            }
        },
        methods: {
            send(msg) {
                window.parent.postMessage(msg, '*');
            },
            // 点击背包物品：搜刮后移入战利品区；否则家→仓库、地点→暂存点
            onBagItem(index) {
                if (this.pendingLoot) {
                    this.send({ type: 'bag-to-loot', index: index });
                } else if (this.currentScene === 'safehouse') {
                    this.send({ type: 'bag-move-storage', index: index });
                } else if (this.currentScene === 'place') {
                    this.send({ type: 'bag-stash', index: index });
                }
            },
            // 点击下部物品：转移到背包（仓库→背包 / 暂存点→背包）
            onStorageItem(index) {
                if (this.currentScene === 'safehouse') {
                    this.send({ type: 'storage-move-bag', index: index });
                } else if (this.currentScene === 'place') {
                    this.send({ type: 'stash-take', index: index });
                }
            },
            // 点击战利品：直接取回背包（有空间则入包，否则落入暂存区）
            lootTake(index) {
                this.send({ type: 'loot-take', index: index });
            },
            // 点击装备槽：弹出选择菜单，列出该槽可装备物品（含已装备，已装备置顶标记）
            onEquipSlot(slot) {
                var label = { weapon: '武器', tool: '工具', hat: '帽子', armor: '防具' }[slot] || '';
                this.equipMenu = { show: true, slot: slot, slotLabel: label, items: this.equipItemsForSlot(slot) };
            },
            // 该槽可装备物品（含已装备），返回 { item, index, equipped }；index 为背包索引（已装备为 null）
            equipItemsForSlot(slot) {
                var cur = this.equipment[slot];
                var list = [];
                if (cur) list.push({ item: cur, index: null, equipped: true });
                for (var i = 0; i < this.bag.length; i++) {
                    var it = this.bag[i];
                    if (!it) continue;
                    var isHat = it.type === 'armor' && (it.slot === 'hat' || (!it.slot && it.name && (it.name.includes('盔') || it.name.includes('帽'))));
                    var isArmor = it.type === 'armor' && !isHat;
                    var match = slot === 'weapon' ? it.type === 'weapon'
                        : slot === 'tool' ? (it.type === 'tool' || !!it.axe)   // 斧类可当工具（如消防斧）
                        : slot === 'hat' ? isHat
                        : slot === 'armor' ? isArmor
                        : false;
                    if (match) list.push({ item: it, index: i, equipped: false });
                }
                return list;
            },
            // 点击装备项：已装备→卸下，未装备→装备（携带目标槽，供双槽物品如消防斧指定）
            onEquipItem(e) {
                if (e.equipped) {
                    this.send({ type: 'unequip-slot', slot: this.equipMenu.slot });
                } else {
                    this.send({ type: 'bag-equip', index: e.index, slot: this.equipMenu.slot });
                }
                this.equipMenu.show = false;
            },
            closeEquipMenu() {
                this.equipMenu.show = false;
            }
        }
    });

    window.addEventListener('message', function (e) {
        var msg = e.data;
        if (msg && msg.type === 'init') {
            app.currentScene = msg.state.currentScene;
            app.currentPlace = msg.state.currentPlace || null;
            app.bag = msg.state.bag;
            app.storageItems = msg.state.storageItems || [];
            app.placeStash = msg.state.placeStash || {};
            app.pendingLoot = msg.state.pendingLoot || null;
            app.bagMax = msg.state.bagMax;
            app.bagLevel = msg.state.bagLevel || 0;
            app.equipment = msg.state.equipment || { weapon: null, tool: null, hat: null, armor: null };
            app.loaded = true;
        } else if (msg && msg.type === 'scroll-reset') {
            // 每次打开页面时：各滚动区回到顶部（转移/使用刷新时不重置）
            app.$nextTick(function () {
                var els = document.querySelectorAll('.st-items');
                for (var i = 0; i < els.length; i++) els[i].scrollTop = 0;
            });
        }
    });
    </script>
</body>
</html>
