<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>榨汁机</title>
    <style>[v-cloak] { display: none; }</style>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/subpages.css">
</head>
<body class="scene-page" oncontextmenu="return false">
    <!-- 榨汁机子页：固定榨汁菜单，按背包+仓库蔬果直接制作；Vue 数据加载完成前隐藏 -->
    <div id="juicer" class="page-root" v-cloak style="display:none" v-show="loaded">
        <div class="page-header">
            <button class="page-back" @click="send({ type: 'close-page' })">‹ 返回</button>
        </div>
        <div class="page-body">
            <!-- 制作按钮：固定菜单，按背包+仓库蔬果直接制作 -->
            <div class="stove-ops">
                <div v-for="a in GameData.juiceRecipes" :key="a.name" class="stove-item-row">
                    <div class="stove-item-main">
                        <span class="stove-item-name" v-text="a.name"></span>
                        <span class="stove-item-cost">
                            <span v-for="(amt, mat) in a.inputs" :key="mat"
                                  :class="have(mat) >= amt ? 'enough' : 'lacking'" v-text="mat + '×' + amt"></span>
                        </span>
                    </div>
                    <button class="bed-upgrade-btn stove-cook-btn"
                            :disabled="!canMake(a)"
                            @click="send({ type: 'juice-make', name: a.name })">
                        <span>榨汁</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/vue.min.js"></script>
    <script>
    // 榨汁机子页：Vue 渲染固定榨汁菜单，操作转发给外壳处理
    var app = new Vue({
        el: '#juicer',
        data: {
            loaded: false,
            bag: [],
            storageItems: []
        },
        computed: {
            // 背包 + 仓库全部可榨原料
            allItems() {
                return (this.bag || []).concat(this.storageItems || []);
            }
        },
        methods: {
            send(msg) {
                window.parent.postMessage(msg, '*');
            },
            // 当前背包+仓库中某物品的总数量
            have(name) {
                return this.allItems
                    .filter(it => it.name === name)
                    .reduce((s, it) => s + (it.count || 1), 0);
            },
            // 当前菜单项是否可制作：原料充足
            canMake(a) {
                for (var mat in a.inputs) {
                    if (this.have(mat) < a.inputs[mat]) return false;
                }
                return true;
            }
        }
    });

    window.addEventListener('message', function (e) {
        var msg = e.data;
        if (msg && msg.type === 'init') {
            app.bag = msg.state.bag;
            app.storageItems = msg.state.storageItems || [];
            app.loaded = true;
        }
    });

    window.addEventListener("message", function (e) {
        if (e.data && e.data.type === "scroll-reset") {
            app.$nextTick(function () {
                var s = document.querySelectorAll("*");
                for (var i = 0; i < s.length; i++) {
                    if (s[i].scrollHeight > s[i].clientHeight) s[i].scrollTop = 0;
                }
            });
        }
    });
    </script>
</body>
</html>
