<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 核心：禁止移动端缩放，保证游戏体验 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Echoes of the End</title>
    <!-- 内联 v-cloak：随 HTML 同步解析，防止刷新时模板闪烁 -->
    <style>[v-cloak] { display: none; }</style>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- @contextmenu.prevent：禁用默认右键菜单；初始内联隐藏，等 Vue 完全加载后再显示 -->
    <div id="app" v-cloak style="display:none" @contextmenu.prevent>

            <!-- 环境信息 -->
            <div class="top-bar">
                <span class="day-count" v-text="'📅 ' + day"></span>
                <span v-text="season + '季'"></span>
                <span v-text="'🌡️ ' + temperature + '°C'"></span>
                <span v-text="weather"></span>
                <span class="time-info" v-text="'🕒 ' + time"></span>
            </div>

            <!-- 日志（只显示最新 5 条） -->
            <div class="log-panel">
                <div v-for="(log, i) in visibleLogs" :key="i" class="log-line">
                    <span class="log-time" v-text="log.time"></span><span v-text="log.text"></span>
                </div>
            </div>

            <!-- 场景标题（固定在日志下方，随场景切换名称；右侧：状态 + 背包 + 设置） -->
            <div class="section-title scene-title">
                <span v-text="sceneTitle"></span>
                <div class="scene-title-btns">
                    <button class="stats-btn" @click="toggleStats" title="状态">❤</button>
                    <button class="bag-btn" @click="openBag" title="背包">🎒</button>
                    <button class="settings-btn" @click="openSettings" title="设置">⚙️</button>
                </div>
            </div>

        <!-- ============ 场景区（安全屋 / 地图 / 地点占位） ============ -->
        <div class="scene-area">

            <!-- 场景：安全屋（室内 / 大门 / 狗窝 / 防御栅栏置底） -->
            <div v-show="currentScene === 'safehouse'" class="scene safehouse-scene">

                <!-- 室内：安全屋设施 -->
                <div class="interior-area">
                    <div class="furniture-grid">
                        <div class="furniture-slot" :class="{ unlocked: furniture[0].unlocked }">
                            <div class="slot-icon" v-text="furniture[0].icon"></div>
                            <span v-text="furniture[0].name"></span>
                            <div v-if="!furniture[0].unlocked" class="lock-overlay">🔒</div>
                        </div>
                        <div class="furniture-slot" :class="{ unlocked: furniture[1].unlocked }">
                            <div class="slot-icon" v-text="furniture[1].icon"></div>
                            <span v-text="furniture[1].name"></span>
                            <div v-if="!furniture[1].unlocked" class="lock-overlay">🔒</div>
                        </div>
                        <div class="furniture-slot" :class="{ unlocked: furniture[2].unlocked }">
                            <div class="slot-icon" v-text="furniture[2].icon"></div>
                            <span v-text="furniture[2].name"></span>
                            <div v-if="!furniture[2].unlocked" class="lock-overlay">🔒</div>
                        </div>
                        <div class="furniture-slot" :class="{ unlocked: furniture[3].unlocked }">
                            <div class="slot-icon" v-text="furniture[3].icon"></div>
                            <span v-text="furniture[3].name"></span>
                            <div v-if="!furniture[3].unlocked" class="lock-overlay">🔒</div>
                        </div>
                        <div class="furniture-slot" :class="{ unlocked: furniture[4].unlocked }">
                            <div class="slot-icon" v-text="furniture[4].icon"></div>
                            <span v-text="furniture[4].name"></span>
                            <div v-if="!furniture[4].unlocked" class="lock-overlay">🔒</div>
                        </div>
                        <div class="furniture-slot" :class="{ unlocked: furniture[5].unlocked }">
                            <div class="slot-icon" v-text="furniture[5].icon"></div>
                            <span v-text="furniture[5].name"></span>
                            <div v-if="!furniture[5].unlocked" class="lock-overlay">🔒</div>
                        </div>
                        <div class="furniture-slot" :class="{ unlocked: furniture[6].unlocked }">
                            <div class="slot-icon" v-text="furniture[6].icon"></div>
                            <span v-text="furniture[6].name"></span>
                            <div v-if="!furniture[6].unlocked" class="lock-overlay">🔒</div>
                        </div>
                        <div class="furniture-slot" :class="{ unlocked: furniture[7].unlocked }">
                            <div class="slot-icon" v-text="furniture[7].icon"></div>
                            <span v-text="furniture[7].name"></span>
                            <div v-if="!furniture[7].unlocked" class="lock-overlay">🔒</div>
                        </div>
                    </div>
                </div>

                <!-- 大门（狗窝上方）：横线 + 右侧大门 -->
                <div class="room-divider">
                    <div class="divider-line"></div>
                    <button class="divider-door" @click="openDoorConfirm" title="外出探索">
                        <span class="divider-door-icon">🚪</span>
                        <span>大门</span>
                    </button>
                </div>

                <!-- 室外：狗窝、防御栅栏（默认锁定，栅栏置底） -->
                <div class="outdoor-area">
                    <div class="outdoor-item" :class="{ locked: !outdoors[0].unlocked }"
                         @click="outdoorClick(outdoors[0])">
                        <div class="outdoor-icon" v-text="outdoors[0].icon"></div>
                        <div class="outdoor-info">
                            <div class="outdoor-name" v-text="outdoors[0].name"></div>
                            <div class="outdoor-desc" v-text="outdoors[0].desc"></div>
                        </div>
                        <div v-if="!outdoors[0].unlocked" class="lock-overlay">🔒</div>
                    </div>
                    <div class="outdoor-item" :class="{ locked: !outdoors[1].unlocked }"
                         @click="outdoorClick(outdoors[1])">
                        <div class="outdoor-icon" v-text="outdoors[1].icon"></div>
                        <div class="outdoor-info">
                            <div class="outdoor-name" v-text="outdoors[1].name"></div>
                            <div class="outdoor-desc" v-text="outdoors[1].desc"></div>
                        </div>
                        <div v-if="!outdoors[1].unlocked" class="lock-overlay">🔒</div>
                    </div>
                </div>

            </div>

            <!-- 场景：地图（15 列 × 19 行静态格子地图，由 buildMap() 一次性构建，初始内联隐藏） -->
            <div v-show="currentScene === 'map'" style="display:none" class="scene map-scene">
                <!-- 静态地图容器：格子与建筑由 JS 原生 DOM 填充 -->
                <div class="map-grid" ref="mapGrid"></div>
            </div>

            <!-- 场景：地点占位（进入地点/公园/森林后显示，初始内联隐藏） -->
            <div v-show="currentScene === 'place'" style="display:none" class="scene place-scene">
                <div class="place-content">
                    <div class="place-icon" v-text="currentPlace ? currentPlace.icon : '📍'"></div>
                    <div class="place-title" v-text="currentPlace ? currentPlace.name : ''"></div>
                    <p class="place-hint">此处暂未开放，敬请期待后续版本。</p>
                    <button class="place-back" @click="backToMap">🗺️ 返回地图</button>
                </div>
            </div>

        </div>

        <!-- 确认弹窗（初始内联隐藏，防止刷新闪烁） -->
        <div v-show="dialog.show" style="display:none" class="dialog-overlay" @click.self="closeDialog">
            <div class="dialog-panel">
                <div class="dialog-icon" v-text="dialog.icon"></div>
                <div class="dialog-title" v-text="dialog.title"></div>
                <div class="dialog-desc" v-text="dialog.desc"></div>
                <div v-if="dialog.cost" class="dialog-cost" v-text="dialog.cost"></div>
                <div class="dialog-btns">
                    <button class="dialog-cancel" @click="closeDialog">取消</button>
                    <button class="dialog-confirm" @click="confirmAction"
                            v-text="dialog.action === 'home' || dialog.action === 'enter-loc' || dialog.action === 'enter-cell' ? '进入' : '出发'"></button>
                </div>
            </div>
        </div>

        <!-- 状态面板（点击 ❤ 显示，初始内联隐藏，防止刷新闪烁） -->
        <div v-show="showStats" style="display:none" class="stats-overlay" @click.self="closeStats">
            <div class="stats-panel">
                <div class="stats-header">
                    <span>❤ 人物状态</span>
                    <button class="stats-close" @click="closeStats">✕</button>
                </div>
                <div class="stats-body">
                    <div class="stat-item hp">
                        <div class="stat-icon">♥</div>
                        <div class="stat-bar-bg"><div class="stat-bar-fill" :style="{ width: stats.hp + '%' }"></div><div class="stat-value" v-text="stats.hp"></div></div>
                        <span class="stat-label">生命</span>
                    </div>
                    <div class="stat-item hunger">
                        <div class="stat-icon">🍖</div>
                        <div class="stat-bar-bg"><div class="stat-bar-fill" :style="{ width: stats.hunger + '%' }"></div><div class="stat-value" v-text="stats.hunger"></div></div>
                        <span class="stat-label">饱食</span>
                    </div>
                    <div class="stat-item water">
                        <div class="stat-icon">💧</div>
                        <div class="stat-bar-bg"><div class="stat-bar-fill" :style="{ width: stats.water + '%' }"></div><div class="stat-value" v-text="stats.water"></div></div>
                        <span class="stat-label">水分</span>
                    </div>
                    <div class="stat-item sanity">
                        <div class="stat-icon">🧠</div>
                        <div class="stat-bar-bg"><div class="stat-bar-fill" :style="{ width: stats.sanity + '%' }"></div><div class="stat-value" v-text="stats.sanity"></div></div>
                        <span class="stat-label">理智</span>
                    </div>
                    <div class="stat-item stamina">
                        <div class="stat-icon">⚡</div>
                        <div class="stat-bar-bg"><div class="stat-bar-fill" :style="{ width: stats.stamina + '%' }"></div><div class="stat-value" v-text="stats.stamina"></div></div>
                        <span class="stat-label">精力</span>
                    </div>
                    <div class="stat-item physical">
                        <div class="stat-icon">💪</div>
                        <div class="stat-bar-bg"><div class="stat-bar-fill" :style="{ width: stats.physical + '%' }"></div><div class="stat-value" v-text="stats.physical"></div></div>
                        <span class="stat-label">体力</span>
                    </div>
                    <div class="stat-item health">
                        <div class="stat-icon">💚</div>
                        <div class="stat-bar-bg"><div class="stat-bar-fill" :style="{ width: stats.health + '%' }"></div><div class="stat-value" v-text="stats.health"></div></div>
                        <span class="stat-label">健康</span>
                    </div>
                    <div class="stat-item strength">
                        <div class="stat-icon">🥊</div>
                        <div class="stat-bar-bg"><div class="stat-bar-fill" :style="{ width: stats.strength + '%' }"></div><div class="stat-value" v-text="stats.strength"></div></div>
                        <span class="stat-label">力量</span>
                    </div>
                    <div class="stat-item speed">
                        <div class="stat-icon">💨</div>
                        <div class="stat-bar-bg"><div class="stat-bar-fill" :style="{ width: stats.speed + '%' }"></div><div class="stat-value" v-text="stats.speed"></div></div>
                        <span class="stat-label">速度</span>
                    </div>
                    <div class="stat-item knowledge">
                        <div class="stat-icon">📚</div>
                        <div class="stat-bar-bg"><div class="stat-bar-fill" :style="{ width: stats.knowledge + '%' }"></div><div class="stat-value" v-text="stats.knowledge"></div></div>
                        <span class="stat-label">知识</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 设置面板（非首次显示，初始内联隐藏，防止刷新闪烁） -->
        <div v-show="showSettings" style="display:none" class="settings-overlay" @click.self="closeSettings">
            <div class="settings-panel">
                <div class="settings-header">
                    <span>⚙️ 设置</span>
                    <button class="settings-close" @click="closeSettings">✕</button>
                </div>
                <div class="settings-body">
                    <p class="settings-desc">进度会自动保存到浏览器本地。</p>
                    <button class="danger-btn" @click="openClearConfirm">🗑️ 清除进度</button>
                </div>
            </div>
        </div>

        <!-- 清除进度确认弹窗（初始内联隐藏，防止刷新闪烁） -->
        <div v-show="confirmDialog.show" style="display:none" class="dialog-overlay" @click.self="confirmCancel">
            <div class="dialog-panel">
                <div class="dialog-title" v-text="confirmDialog.title"></div>
                <div class="dialog-desc" v-text="confirmDialog.desc"></div>
                <div class="dialog-btns">
                    <button class="dialog-cancel" @click="confirmCancel">取消</button>
                    <button class="dialog-confirm" @click="confirmClear">确定</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Vue 2（UMD 版） -->
    <script src="js/vue.min.js"></script>
    <!-- 游戏数据 -->
    <script src="js/data.js"></script>
    <!-- 地图数据 -->
    <script src="js/map.js"></script>
    <!-- 应用逻辑 -->
    <script src="js/app.js"></script>
</body>
</html>
